<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地 Agent 方案 - Form2Offer</title>
    <link rel="stylesheet" href="./agent-review.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div><p class="kicker">FORM2OFFER LOCAL AGENT</p><h1>填写方案审阅</h1></div>
        <button id="cancelBtn" class="ghost" type="button">取消任务</button>
      </header>
      <section class="notice">方案确认前不会修改招聘网页。文件上传、验证码、敏感声明和最终提交不会执行。</section>
      <section class="card">
        <div id="stage" class="stage">正在连接 Local Bridge...</div>
        <p id="summary" class="summary"></p>
        <div id="warnings" class="warnings"></div>
      </section>
      <section id="contextCard" class="card context" hidden>
        <h2>这家公司与这个平台</h2>
        <p id="appliedLine" class="context-line" hidden></p>
        <p id="insightLine" class="context-line" hidden></p>
        <ul id="insightItems" class="context-list"></ul>
        <p id="resumeLine" class="context-line" hidden></p>
        <details id="tipsBox" hidden>
          <summary id="tipsTitle">平台注意事项</summary>
          <ul id="tipsList" class="context-list"></ul>
        </details>
      </section>
      <section id="planCard" class="card" hidden>
        <div class="plan-head"><h2>建议填写项</h2><label><input id="selectAll" type="checkbox" checked /> 全选普通字段</label></div>
        <p class="meta">开放题答案可以直接在框里修改，确认时按修改后的内容填写。</p>
        <div id="items" class="items"></div>
        <label class="remember"><input id="rememberAnswers" type="checkbox" checked /> 把确认填写的开放题答案记进本地问答库（以后同题可直接复用）</label>
        <button id="applyBtn" type="button">确认并填写所选字段</button>
        <p id="applyFeedback" class="feedback" aria-live="polite"></p>
      </section>
    </main>
    <script src="./agent-review.js"></script>
  </body>
</html>
